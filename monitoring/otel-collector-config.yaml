receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: 'backend'
          static_configs:
            - targets: ['backend:8000']
          metrics_path: /metrics

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_mib: 4000
    spike_limit_mib: 500

exporters:
  otlp:
    endpoint: query-service:4317
    tls:
      insecure: true

  prometheus:
    endpoint: "0.0.0.0:8888"
    namespace: "demo"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp]

    metrics:
      receivers: [otlp, prometheus]
      processors: [batch]
      exporters: [otlp, prometheus]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp]
