services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: demo-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      APP_ENV: ${APP_ENV:-mock}
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: demo-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-mock}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-demo-k8s-backend}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - otel-collector
    networks:
      - app-network

  hyperdx:
    image: hyperdx/hyperdx:latest
    container_name: demo-hyperdx
    environment:
      HYPERDX_APP_PORT: 8080
      HYPERDX_API_PORT: 8000
      HYPERDX_OPAMP_PORT: 4320
      HYPERDX_IMAGE: hyperdx
      IS_LOCAL_APP_MODE: REQUIRED_AUTH
      OTEL_SERVICE_NAME: demo-k8s-hyperdx
    ports:
      - "${HYPERDX_UI_PORT:-18080}:8080"
      - "${HYPERDX_API_PORT:-18001}:8000"
      - "${HYPERDX_OPAMP_PORT:-14320}:4320"
    networks:
      - app-network

  otel-collector:
    image: signoz/signoz-otel-collector:${SIGNOZ_OTEL_COLLECTOR_TAG:-0.102.0}
    container_name: demo-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./monitoring/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_HEALTH_PORT:-13133}:13133"
    depends_on:
      - hyperdx
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes: {}
